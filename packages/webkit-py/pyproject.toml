[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beamline-webkit"
version = "0.1.0"
description = "Shared Python side of the beamline web stack: app factory, binary arrays, serve command, OpenAPI export and pytest fixtures"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Miaoqi Chu", email = "mqichu@anl.gov" }]
keywords = ["fastapi", "beamline", "synchrotron", "web"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.24",
  "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["beamline-webkit[test]", "ruff", "mypy"]

# the fixtures of beamline_webkit.testing are available to every test suite that installs the package
[project.entry-points.pytest11]
beamline_webkit = "beamline_webkit.testing"

[tool.hatch.build.targets.wheel]
packages = ["src/beamline_webkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["beamline_webkit"]

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
