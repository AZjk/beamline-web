name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint, typecheck, test, build, storybook, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # the version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Generated types match the committed ones
        run: |
          pnpm gen:types
          git diff --exit-code -- apps/*/src/api

      - run: pnpm build
      - run: pnpm build-storybook

      - name: Playwright browser
        run: pnpm --filter @beamline-web/app-xpcs exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/*/playwright-report
          if-no-files-found: ignore

  webkit-py:
    name: webkit-py (ruff, mypy, pytest, install from git)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/webkit-py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync --all-extras --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -ra

      - name: Install the package from git and serve the health route behind a prefix
        working-directory: ${{ github.workspace }}
        run: |
          uv venv /tmp/from-git
          uv pip install --python /tmp/from-git/bin/python "beamline-webkit[test] @ git+file://${GITHUB_WORKSPACE}#subdirectory=packages/webkit-py"
          /tmp/from-git/bin/python - <<'PY'
          from beamline_webkit import AppInfo, behind_prefix, create_app
          from beamline_webkit.testing import client_for

          app = behind_prefix(create_app(AppInfo(name="t", title="t", version="0", schema_version="0.1.0")), "/t")
          answer = client_for(app).get("/t/api/health")
          assert answer.status_code == 200 and answer.json()["status"] == "ok", answer.text
          print("health behind /t:", answer.json())
          PY

  e2e-xpcs:
    name: xpcs app over a real service (synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - name: The service, from pyXpcsViewer's web branch, with the shared package from this checkout
        run: |
          uv venv service
          uv pip install --python service/bin/python ./packages/webkit-py
          uv pip install --python service/bin/python "xpcs-viewer[web] @ git+https://github.com/AdvancedPhotonSource/pyXpcsViewer.git@web"

      - name: Build the app into the service's static folder, as a release wheel carries it
        run: |
          pnpm --filter @beamline-web/app-xpcs build
          static=$(service/bin/python -c "import os, pyxpcsviewer.web; print(os.path.join(os.path.dirname(pyxpcsviewer.web.__file__), 'static'))")
          node scripts/deploy-app.mjs xpcs "$static"

      - name: Synthetic result files, and the service over them
        run: |
          service/bin/pyxpcsviewer-synthetic "$RUNNER_TEMP/data"
          nohup service/bin/pyxpcsviewer-web "$RUNNER_TEMP/data" --port 8070 --log-level warning > "$RUNNER_TEMP/service.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8070/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8070/ | grep -q "assets/" || { echo "the page is not the built app"; cat "$RUNNER_TEMP/service.log"; exit 1; }

      - run: pnpm --filter @beamline-web/app-xpcs exec playwright install --with-deps chromium

      - name: The real-data flow against the service
        env:
          XPCS_URL: http://127.0.0.1:8070
        run: pnpm --filter @beamline-web/app-xpcs exec playwright test e2e/real-data.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-xpcs-report
          path: |
            apps/xpcs/test-results
            ${{ runner.temp }}/service.log
          if-no-files-found: ignore

  e2e-gixs:
    name: gixs app over a real service (synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - name: The service, from gixsu's refactoring branch, with the shared package from this checkout
        run: |
          uv venv service
          uv pip install --python service/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python service/bin/python ./packages/webkit-py
          uv pip install --python service/bin/python "gixsu[web] @ git+https://github.com/AdvancedPhotonSource/gixsu.git@mc_refact"

      - name: Build the app into the service's static folder, as a release wheel carries it
        run: |
          pnpm --filter @beamline-web/app-gixs build
          static=$(service/bin/python -c "import os, gixsu.web; print(os.path.join(os.path.dirname(gixsu.web.__file__), 'static'))")
          node scripts/deploy-app.mjs gixs "$static"

      - name: Synthetic files, and the service over them
        run: |
          service/bin/gixsu synthetic "$RUNNER_TEMP/data"
          nohup service/bin/gixsu web --path "$RUNNER_TEMP/data" --port 8060 --no-dash --log-level warning > "$RUNNER_TEMP/service.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8060/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8060/ | grep -q "assets/" || { echo "the page is not the built app"; cat "$RUNNER_TEMP/service.log"; exit 1; }

      - run: pnpm --filter @beamline-web/app-gixs exec playwright install --with-deps chromium

      - name: The real-data flow against the service
        env:
          GIXS_URL: http://127.0.0.1:8060
        run: pnpm --filter @beamline-web/app-gixs exec playwright test e2e/real-data.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-gixs-report
          path: |
            apps/gixs/test-results
            ${{ runner.temp }}/service.log
          if-no-files-found: ignore
